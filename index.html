<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Chess</title>
        <link rel="stylesheet" href="style/reset.css">
        <link rel="stylesheet" href="style/board.css">
    </head>
    <body>
        <button id="btn-settings" class="settings-btn" title="Settings">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
        </button>

        <div id="settings-overlay" class="settings-overlay hidden">
            <div class="settings-modal">
                <div class="settings-header">
                    <h2>Settings</h2>
                    <button id="btn-settings-close" class="settings-close">&times;</button>
                </div>
                <div class="settings-body">
                    <div class="settings-section">
                        <label class="settings-label">Theme</label>
                        <div id="theme-list" class="theme-list"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="pgn-upload-area" id="pgn-upload-area">
            <input type="file" id="pgn-file-input" accept=".pgn" hidden>
            <button id="btn-upload" class="upload-btn">Load PGN File</button>
            <span class="upload-hint">or drag &amp; drop a .pgn file</span>
            <div id="game-selector-container" class="game-selector-container hidden">
                <select id="game-selector" class="game-selector"></select>
            </div>
        </div>

        <div class="page-layout">
            <div class="board-container">
                <div id="captured-top" class="captured-pieces"></div>
                <div class="board">

                        <li>g</li>

                    </ul>
                </div>
                <div id="captured-bottom" class="captured-pieces"></div>
            </div>

            <div class="side-panel">
                <div class="move-list-container">
                    <div id="move-list" class="move-list"></div>
                </div>

                <div id="move-hint" class="move-hint"></div>
            </div>

            <div class="replay-controls">
                <div class="controls-row">
                    <button id="btn-start" title="Go to start" disabled>&#x21E4;</button>
                    <button id="btn-prev" title="Previous move" disabled>&#x2190;</button>
                    <button id="btn-play" title="Play" disabled>&#x25B6;</button>
                    <button id="btn-next" title="Next move" disabled>&#x2192;</button>
                    <button id="btn-end" title="Go to end" disabled>&#x21E5;</button>
                    <span id="move-counter" class="move-counter">0 / 0</span>
                </div>
                <div class="speed-row">
                    <label for="speed-slider">Speed</label>
                    <input type="range" id="speed-slider" min="100" max="3000" value="1000" step="100">
                    <span id="speed-label">1.0s</span>
                </div>
            </div>

            <div id="game-info" class="game-info"></div>
        </div>
